<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Square Jumper - Cartoon Platformer Edition</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #bfe9ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: manipulation;
    overflow: hidden;
  }
  #gameWrap {
    position: relative;
    box-shadow: 0 14px 35px rgba(40, 90, 120, 0.28);
    border-radius: 12px;
    overflow: hidden;
  }
  canvas {
    background: #69c9f5;
    display: block;
    border: 0;
    border-radius: 12px;
    width: min(1200px, calc(100vw - 12px));
    height: auto;
  }
  #hud {
    position: absolute;
    top: 18px;
    left: 24px;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #234a62, -1px -1px 0 #234a62, 1px -1px 0 #234a62, -1px 1px 0 #234a62;
    user-select: none;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.75);
    border-radius: 4px;
    z-index: 10;
  }
  #overlay h1 {
    color: #fff;
    font-size: 44px;
    margin: 0 0 10px 0;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
  }
  #overlay p {
    color: #f5a623;
    font-size: 20px;
    margin: 0 0 20px 0;
  }
  #overlay button {
    padding: 12px 28px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #f5a623;
    color: #1a1a2e;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  #overlay button:hover {
    background: #ffbf47;
    transform: scale(1.05);
  }
  #hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.95);
    font-size: 14px;
    font-weight: 700;
    text-shadow: 2px 2px 0 #234a62;
    user-select: none;
    pointer-events: none;
    text-align: center;
    width: 100%;
  }
  /* Mobile Touch Controls Overlay */
  #touchControls {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    height: 90px;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 5;
    pointer-events: none;
  }
  .touch-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
  }
  .tbtn {
    width: 65px;
    height: 65px;
    background: rgba(255, 255, 255, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    color: #111;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    touch-action: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .tbtn:active {
    background: rgba(245, 166, 35, 0.7);
  }
  @media (min-width: 900px) {
    #touchControls { display: none; } /* Show on mobile/tablet viewports */
  }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="game" width="900" height="450"></canvas>
  <div id="hud">Score: <span id="score">0</span> | Power: <span id="power">None</span></div>
  <div id="hint">Arrow Keys / A-D to Move &middot; Space / Up to Double Jump</div>
  
  <div id="touchControls">
    <div class="touch-group">
      <div class="tbtn" id="btnLeft">&#9664;</div>
      <div class="tbtn" id="btnRight">&#9654;</div>
    </div>
    <div class="touch-group">
      <div class="tbtn" id="btnJump">&#9650;</div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">Game Over</h1>
    <p id="overlaySub">Final Score: 0</p>
    <button id="overlayBtn">Restart</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const GROUND_HEIGHT = 60;
  const GROUND_Y = H - GROUND_HEIGHT;
  const GRAVITY = 0.55;
  const JUMP_FORCE = -12.5;

  const SEGMENT_WIDTH = 900;
  const NUM_SEGMENTS = 8;
  const WORLD_WIDTH = SEGMENT_WIDTH * NUM_SEGMENTS;

  const scoreEl = document.getElementById('score');
  const powerEl = document.getElementById('power');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');

  // ==================== 1. SOUND EFFECTS (Web Audio API) ====================
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSFX(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'jump') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(480, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'coin') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now); // D5
      osc.frequency.setValueAtTime(880, now + 0.08); // A5
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'powerup') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(700, now + 0.25);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'stomp') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.2);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'win') {
      osc.type = 'triangle';
      [400, 500, 600, 800].forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.1);
        g.gain.setValueAtTime(0.2, now + idx * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
        o.start(now + idx * 0.1);
        o.stop(now + idx * 0.1 + 0.2);
      });
    }
  }

  // ==================== 2. LEVEL GENERATION VARIETY ====================
  function buildWorld() {
    let platforms = [];
    let coins = [];
    let enemies = [];
    let powerups = [];
    let questionBlocks = [];

    // Question blocks: hit them from below to get a reward.
    // They are placed in the same segments where the yellow blocks are drawn.
    questionBlocks.push(
      { x: SEGMENT_WIDTH + 120, y: GROUND_Y - 175, w: 44, h: 44, used: false, type: 'coin' },
      { x: SEGMENT_WIDTH * 2 + 180, y: GROUND_Y - 160, w: 44, h: 44, used: false, type: 'speed' },
      { x: SEGMENT_WIDTH * 3 + 520, y: GROUND_Y - 185, w: 44, h: 44, used: false, type: 'bounce' },
      { x: SEGMENT_WIDTH * 5 + 180, y: GROUND_Y - 155, w: 44, h: 44, used: false, type: 'shield' },
      { x: SEGMENT_WIDTH * 6 + 420, y: GROUND_Y - 190, w: 44, h: 44, used: false, type: 'coins' },
      { x: SEGMENT_WIDTH * 7 + 300, y: GROUND_Y - 185, w: 44, h: 44, used: false, type: 'life' }
    );

    for (let i = 0; i < NUM_SEGMENTS; i++) {
      const offset = i * SEGMENT_WIDTH;
      if (i === 0) {
        // Starter Segment
        platforms.push({ x: offset + 200, y: GROUND_Y - 90, w: 140, h: 18 });
        platforms.push({ x: offset + 450, y: GROUND_Y - 160, w: 140, h: 18 });
        coins.push({ x: offset + 270, y: GROUND_Y - 120, r: 9, taken: false });
        coins.push({ x: offset + 520, y: GROUND_Y - 190, r: 9, taken: false });
      } else {
        const segType = i % 4; // Varying segment layouts
        if (segType === 1) {
          // High Altitude Platforms & Moving Platform
          platforms.push({ x: offset + 150, y: GROUND_Y - 100, w: 120, h: 18 });
          platforms.push({ x: offset + 350, y: GROUND_Y - 150, w: 110, h: 18, isMoving: true, minX: offset + 320, maxX: offset + 550, vx: 1.8 });
          platforms.push({ x: offset + 620, y: GROUND_Y - 210, w: 130, h: 18 });
          
          coins.push({ x: offset + 210, y: GROUND_Y - 130, r: 9, taken: false });
          coins.push({ x: offset + 685, y: GROUND_Y - 240, r: 9, taken: false });
          
          enemies.push({ x: offset + 400, y: GROUND_Y - 16, r: 16, minX: offset + 200, maxX: offset + 700, speed: 2.5, dir: 1 });
          powerups.push({ x: offset + 685, y: GROUND_Y - 250, type: 'speed', size: 14, taken: false });
        } else if (segType === 2) {
          // Low & High Staggered
          platforms.push({ x: offset + 120, y: GROUND_Y - 70, w: 110, h: 18 });
          platforms.push({ x: offset + 300, y: GROUND_Y - 140, w: 110, h: 18 });
          platforms.push({ x: offset + 480, y: GROUND_Y - 210, w: 110, h: 18 });
          platforms.push({ x: offset + 680, y: GROUND_Y - 110, w: 130, h: 18, isMoving: true, minX: offset + 650, maxX: offset + 800, vx: -2 });

          coins.push({ x: offset + 175, y: GROUND_Y - 100, r: 9, taken: false });
          coins.push({ x: offset + 355, y: GROUND_Y - 170, r: 9, taken: false });
          coins.push({ x: offset + 535, y: GROUND_Y - 240, r: 9, taken: false });

          enemies.push({ x: offset + 300, y: GROUND_Y - 16, r: 16, minX: offset + 100, maxX: offset + 450, speed: 3.0, dir: 1 });
          enemies.push({ x: offset + 600, y: GROUND_Y - 16, r: 16, minX: offset + 500, maxX: offset + 800, speed: 2.2, dir: -1 });
          powerups.push({ x: offset + 535, y: GROUND_Y - 250, type: 'shield', size: 14, taken: false });
        } else if (segType === 3) {
          // Gauntlet Pattern
          platforms.push({ x: offset + 180, y: GROUND_Y - 130, w: 140, h: 18 });
          platforms.push({ x: offset + 400, y: GROUND_Y - 110, w: 140, h: 18 });
          platforms.push({ x: offset + 630, y: GROUND_Y - 170, w: 140, h: 18 });

          coins.push({ x: offset + 250, y: GROUND_Y - 160, r: 9, taken: false });
          coins.push({ x: offset + 470, y: GROUND_Y - 140, r: 9, taken: false });
          coins.push({ x: offset + 700, y: GROUND_Y - 200, r: 9, taken: false });

          enemies.push({ x: offset + 400, y: GROUND_Y - 16, r: 16, minX: offset + 250, maxX: offset + 650, speed: 3.5, dir: 1 });
        } else {
          // Double Moving Platforms
          platforms.push({ x: offset + 150, y: GROUND_Y - 120, w: 120, h: 18, isMoving: true, minX: offset + 150, maxX: offset + 380, vx: 2 });
          platforms.push({ x: offset + 500, y: GROUND_Y - 190, w: 120, h: 18, isMoving: true, minX: offset + 450, maxX: offset + 720, vx: -2 });

          coins.push({ x: offset + 100, y: GROUND_Y - 30, r: 9, taken: false });
          coins.push({ x: offset + 800, y: GROUND_Y - 30, r: 9, taken: false });

          enemies.push({ x: offset + 500, y: GROUND_Y - 16, r: 16, minX: offset + 300, maxX: offset + 700, speed: 2.8, dir: 1 });
          powerups.push({ x: offset + 250, y: GROUND_Y - 160, type: 'speed', size: 14, taken: false });
        }
      }
    }
    return { platforms, coins, enemies, powerups, questionBlocks };
  }

  function buildFlag() {
    return { x: WORLD_WIDTH - 60, topY: GROUND_Y - 110, poleH: 110, w: 34 };
  }

  let platforms, coins, enemies, powerups, questionBlocks, flag, player, score, keys, gameState, animId, cameraX;



  // ==================== GAME STATE & PHYSICS ====================
  function initGame() {
    const world = buildWorld();
    platforms = world.platforms;
    coins = world.coins;
    enemies = world.enemies;
    powerups = world.powerups;
    questionBlocks = world.questionBlocks;
    flag = buildFlag();

    player = {
      x: 60, y: GROUND_Y - 32, w: 32, h: 32,
      vx: 0, vy: 0,
      isGrounded: false,
      facing: 1,
      jumpCount: 0, // 3. Double Jump Mechanic
      maxJumps: 2,
      shield: false,
      speedTimer: 0
    };

    score = 0;
    cameraX = 0;
    gameState = 'PLAYING';
    keys = { left: false, right: false, up: false };

    scoreEl.innerText = score;
    powerEl.innerText = 'None';
    overlay.style.display = 'none';
  }

  // ==================== INPUT HANDLERS ====================
  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
    initAudio();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
      if (!keys.up) handleJump();
      keys.up = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.up = false;
  });

  // Mobile Touch Controls
  function setupTouchBtn(id, keyProp) {
    const btn = document.getElementById(id);
    if (!btn) return;
    const press = (e) => {
      e.preventDefault();
      initAudio();
      if (keyProp === 'up' && !keys.up) handleJump();
      keys[keyProp] = true;
    };
    const release = (e) => {
      e.preventDefault();
      keys[keyProp] = false;
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
  }
  setupTouchBtn('btnLeft', 'left');
  setupTouchBtn('btnRight', 'right');
  setupTouchBtn('btnJump', 'up');

  function handleJump() {
    if (gameState !== 'PLAYING') return;
    if (player.isGrounded || player.jumpCount < player.maxJumps) {
      player.vy = JUMP_FORCE;
      player.isGrounded = false;
      player.jumpCount++;
      playSFX('jump');
    }
  }

  // ==================== UPDATE LOGIC ====================
  function update() {
    if (gameState !== 'PLAYING') return;

    // Speed Power-up effect
    const moveSpeed = player.speedTimer > 0 ? 6.5 : 4.2;
    if (player.speedTimer > 0) {
      player.speedTimer--;
      if (player.speedTimer === 0 && !player.shield) powerEl.innerText = 'None';
    }

    // Player horizontal movement
    if (keys.left) {
      player.vx = -moveSpeed;
      player.facing = -1;
    } else if (keys.right) {
      player.vx = moveSpeed;
      player.facing = 1;
    } else {
      player.vx = 0;
    }

    // Gravity
    player.vy += GRAVITY;

    // Position updates
    player.x += player.vx;
    player.y += player.vy;

    // Boundaries
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

    // Platform collisions
    player.isGrounded = false;

    // Ground check
    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.isGrounded = true;
      player.jumpCount = 0;
    }

    // Moving & Static Platforms update & collision
    for (const plat of platforms) {
      if (plat.isMoving) {
        plat.x += plat.vx;
        if (plat.x <= plat.minX || plat.x + plat.w >= plat.maxX) plat.vx *= -1;
      }

      // Check collision from top
      if (
        player.vy >= 0 &&
        player.x + player.w > plat.x &&
        player.x < plat.x + plat.w &&
        player.y + player.h >= plat.y &&
        player.y + player.h <= plat.y + player.h + player.vy
      ) {
        player.y = plat.y - player.h;
        player.vy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
        if (plat.isMoving) player.x += plat.vx; // Ride moving platform
      }
    }

    // Question blocks: hit from underneath to activate.
    for (const block of questionBlocks) {
      if (block.used) continue;

      const playerRight = player.x + player.w;
      const playerLeft = player.x;
      const playerTop = player.y;
      const playerBottom = player.y + player.h;

      const overlapsX = playerRight > block.x && playerLeft < block.x + block.w;
      const movingUp = player.vy < 0;
      const crossedBottom = playerTop <= block.y + block.h &&
                            playerTop - player.vy > block.y + block.h;

      if (overlapsX && movingUp && crossedBottom) {
        block.used = true;
        player.y = block.y + block.h;
        player.vy = 1.5;

        // Different blocks give different rewards.
        score += 100;
        if (block.type === 'coin') {
          score += 150;
          powerEl.innerText = '+250 Coins!';
          coins.push({ x: block.x + block.w / 2, y: block.y - 22, r: 9, taken: false });
        } else if (block.type === 'speed') {
          player.speedTimer = 480;
          powerEl.innerText = 'Speed Boost!';
        } else if (block.type === 'bounce') {
          player.vy = JUMP_FORCE * 1.35;
          powerEl.innerText = 'Super Jump!';
        } else if (block.type === 'shield') {
          player.shield = true;
          powerEl.innerText = 'Shield Active!';
        } else if (block.type === 'coins') {
          score += 400;
          powerEl.innerText = '+500 Bonus!';
          for (let i = 0; i < 3; i++) {
            coins.push({
              x: block.x + block.w / 2 + (i - 1) * 24,
              y: block.y - 20 - i * 12,
              r: 9,
              taken: false
            });
          }
        } else if (block.type === 'life') {
          score += 900;
          powerEl.innerText = 'Mega Bonus!';
        }
        scoreEl.innerText = score;
        playSFX('powerup');
      }
    }

    // Collect Coins
    for (const coin of coins) {
      if (!coin.taken) {
        const dx = (player.x + player.w / 2) - coin.x;
        const dy = (player.y + player.h / 2) - coin.y;
        if (Math.sqrt(dx * dx + dy * dy) < coin.r + player.w / 2) {
          coin.taken = true;
          score += 100;
          scoreEl.innerText = score;
          playSFX('coin');
        }
      }
    }

    // Collect Power-ups
    for (const p of powerups) {
      if (!p.taken) {
        const dx = (player.x + player.w / 2) - p.x;
        const dy = (player.y + player.h / 2) - p.y;
        if (Math.sqrt(dx * dx + dy * dy) < p.size + player.w / 2) {
          p.taken = true;
          playSFX('powerup');
          if (p.type === 'speed') {
            player.speedTimer = 300; // 5 sec boost
            powerEl.innerText = 'Speed Boost!';
          } else if (p.type === 'shield') {
            player.shield = true;
            powerEl.innerText = 'Shield Active!';
          }
        }
      }
    }

    // Enemies update & collisions
    for (const enemy of enemies) {
      enemy.x += enemy.speed * enemy.dir;
      if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) enemy.dir *= -1;

      // Player collision
      const dx = (player.x + player.w / 2) - enemy.x;
      const dy = (player.y + player.h / 2) - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < enemy.r + player.w / 2 - 4) {
        // Stomp on enemy head
        if (player.vy > 0 && player.y + player.h - player.vy <= enemy.y - enemy.r / 2) {
          enemy.x = -9999; // Remove enemy
          player.vy = JUMP_FORCE * 0.7; // Bounce off
          score += 200;
          scoreEl.innerText = score;
          playSFX('stomp');
        } else {
          // Player hit
          if (player.shield) {
            player.shield = false;
            enemy.x = -9999;
            powerEl.innerText = 'None';
            playSFX('hit');
          } else {
            triggerGameOver(false);
            return;
          }
        }
      }
    }

    // Win condition check (Flag)
    if (player.x + player.w >= flag.x + 10) {
      triggerGameOver(true);
      return;
    }

    // Camera follow player
    cameraX = player.x - W / 3;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > WORLD_WIDTH - W) cameraX = WORLD_WIDTH - W;
  }

  function triggerGameOver(won) {
    gameState = won ? 'WON' : 'LOST';
    playSFX(won ? 'win' : 'hit');
    overlayTitle.innerText = won ? 'Victory!' : 'Game Over';
    overlaySub.innerText = 'Final Score: ' + score;
    overlay.style.display = 'flex';
  }

  // ==================== CARTOON RENDERING ====================
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function cloud(x, y, s = 1) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(x, y, 20*s, 0, Math.PI*2);
    ctx.arc(x+24*s, y-12*s, 28*s, 0, Math.PI*2);
    ctx.arc(x+55*s, y, 22*s, 0, Math.PI*2);
    ctx.roundRect(x-10*s, y, 75*s, 25*s, 12*s);
    ctx.fill();
    ctx.restore();
  }

  function hill(x, y, w, h, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#63b887';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h, w/2, h, 0, Math.PI, 0);
    ctx.fill();
    ctx.restore();
  }

  function grassTuft(x, y, s = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#238c38';
    ctx.strokeStyle = '#126a29';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-24,-22,-19,-45);
    ctx.quadraticCurveTo(-4,-31,0,-12);
    ctx.quadraticCurveTo(2,-48,12,-57);
    ctx.quadraticCurveTo(18,-35,8,-10);
    ctx.quadraticCurveTo(29,-42,38,-40);
    ctx.quadraticCurveTo(34,-15,10,0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function dirtGround() {
    ctx.fillStyle = '#8a4f20';
    ctx.fillRect(0, GROUND_Y, WORLD_WIDTH, GROUND_HEIGHT);

    // Dirt bands / simple repeating texture.
    ctx.fillStyle = '#744019';
    for (let x = 0; x < WORLD_WIDTH; x += 54) {
      ctx.fillRect(x + 8, GROUND_Y + 22, 30, 6);
      ctx.fillRect(x + 28, GROUND_Y + 47, 22, 6);
    }

    // Bright grass edge.
    ctx.fillStyle = '#2e9e38';
    ctx.fillRect(0, GROUND_Y, WORLD_WIDTH, 11);
    ctx.fillStyle = '#55c94b';
    ctx.fillRect(0, GROUND_Y, WORLD_WIDTH, 4);

    for (let x = 25; x < WORLD_WIDTH; x += 145) {
      grassTuft(x, GROUND_Y + 4, 0.55);
    }
  }

  function drawBlock(x, y, w, h, question = false) {
    ctx.save();
    if (question) {
      ctx.fillStyle = '#ffc928';
      ctx.strokeStyle = '#a66b00';
      ctx.lineWidth = 3;
      roundRect(x, y, w, h, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff7b0';
      ctx.font = 'bold 27px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', x + w/2, y + h/2 + 1);
    } else {
      ctx.fillStyle = '#a95d1e';
      ctx.strokeStyle = '#63340f';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 3);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = '#713c13';
      for (let bx = x + 8; bx < x + w; bx += 25) {
        ctx.beginPath();
        ctx.moveTo(bx, y);
        ctx.lineTo(bx, y+h);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(x, y+h/2);
      ctx.lineTo(x+w, y+h/2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPipe(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = '#27a936';
    ctx.strokeStyle = '#126d24';
    ctx.lineWidth = 3;
    roundRect(x+8, y+18, w-16, h-18, 3);
    ctx.fill(); ctx.stroke();
    roundRect(x, y, w, 25, 5);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(x+12, y+25, 7, h-30);
    ctx.restore();
  }

  function drawGenericRunner(x, y, s = 1) {
    // Original cartoon runner, intentionally generic (not a named character).
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);

    ctx.fillStyle = '#d92d3d';
    ctx.strokeStyle = '#56202a';
    ctx.lineWidth = 3;
    roundRect(-12, 8, 40, 34, 8);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#ffd0a5';
    ctx.beginPath();
    ctx.arc(10, 3, 16, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#2b63b7';
    roundRect(-8, 18, 34, 27, 7);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(4, 0, 4, 0, Math.PI*2);
    ctx.arc(16, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-2, 42); ctx.lineTo(-12, 56);
    ctx.moveTo(20, 42); ctx.lineTo(31, 55);
    ctx.stroke();

    ctx.restore();
  }

  function drawEnemy(enemy) {
    if (!enemySprite.complete || !enemySprite.naturalWidth) return;

    ctx.save();
    ctx.translate(enemy.x, enemy.y);

    const targetH = enemy.r * 2.25;
    const targetW = targetH * (enemySprite.naturalWidth / enemySprite.naturalHeight);

    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(
      enemySprite,
      -targetW / 2,
      -targetH * 0.82,
      targetW,
      targetH
    );

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Sky.
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#55c8f5');
    sky.addColorStop(1, '#bcecff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Distant scenery.
    for (let i = 0; i < WORLD_WIDTH; i += 360) {
      hill(i, GROUND_Y - 120, 240, 120, 0.32);
      hill(i + 150, GROUND_Y - 80, 190, 80, 0.25);
    }
    for (let i = 80; i < WORLD_WIDTH; i += 510) {
      cloud(i, 72 + ((i/510)|0)%2 * 38, 1.0);
    }

    dirtGround();

    // Main platforms now have a green grass cap and brown dirt body.
    for (const plat of platforms) {
      ctx.fillStyle = plat.isMoving ? '#a05b24' : '#8a4f20';
      roundRect(plat.x, plat.y, plat.w, plat.h + 16, 5);
      ctx.fill();
      ctx.fillStyle = '#38a93d';
      roundRect(plat.x-2, plat.y-5, plat.w+4, 12, 5);
      ctx.fill();
      ctx.fillStyle = '#66d14f';
      ctx.fillRect(plat.x+3, plat.y-3, plat.w-6, 3);
    }

    // Decorative level props positioned relative to world segments.
    for (let i = 0; i < NUM_SEGMENTS; i++) {
      const ox = i * SEGMENT_WIDTH;
      if (i % 3 === 0) {
        grassTuft(ox + 105, GROUND_Y + 3, 0.7);
        grassTuft(ox + 760, GROUND_Y + 3, 0.55);
      }
      if (i === 1) {
        // Drawn below from questionBlocks so their used state is visible.
      }
      if (i === 2) drawPipe(ox + 680, GROUND_Y - 105, 58, 105);
      if (i === 4) {
        drawBlock(ox + 300, GROUND_Y - 185, 58, 48, false);
        drawBlock(ox + 360, GROUND_Y - 185, 58, 48, false);
      }
    }

    // Interactive question blocks.
    for (const block of questionBlocks) {
      drawBlock(block.x, block.y, block.w, block.h, !block.used);
      if (block.used) {
        ctx.save();
        ctx.fillStyle = '#b98b2b';
        ctx.strokeStyle = '#765616';
        ctx.lineWidth = 2;
        roundRect(block.x, block.y, block.w, block.h, 5);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#7a5a18';
        ctx.font = 'bold 22px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✓', block.x + block.w / 2, block.y + block.h / 2);
        ctx.restore();
      }
    }

    // Coins.
    for (const coin of coins) {
      if (!coin.taken) {
        ctx.save();
        const bob = Math.sin(performance.now()/180 + coin.x) * 2;
        ctx.translate(coin.x, coin.y + bob);
        ctx.fillStyle = '#ffc928';
        ctx.strokeStyle = '#a86a00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, coin.r*0.72, coin.r, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff3a0';
        ctx.fillRect(-2, -6, 3, 7);
        ctx.restore();
      }
    }

    // Power-ups.
    for (const p of powerups) {
      if (!p.taken) {
        ctx.fillStyle = p.type === 'speed' ? '#39d86b' : '#36bdf2';
        ctx.strokeStyle = '#126b70';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'speed' ? 'S' : 'B', p.x, p.y);
      }
    }

    // Goal flag.
    ctx.fillStyle = '#e7e7e7';
    ctx.fillRect(flag.x + 14, flag.topY, 5, flag.poleH);
    ctx.fillStyle = '#ef3d3d';
    ctx.beginPath();
    ctx.moveTo(flag.x+19, flag.topY+4);
    ctx.lineTo(flag.x+55, flag.topY+18);
    ctx.lineTo(flag.x+19, flag.topY+32);
    ctx.closePath();
    ctx.fill();

    // Enemies.
    for (const enemy of enemies) {
      if (enemy.x > -100 && enemy.x < WORLD_WIDTH + 100) drawEnemy(enemy);
    }

    // Generic runner decoration near the final section.
    drawGenericRunner(WORLD_WIDTH - 165, GROUND_Y - 82, 1.15);

    // Uploaded player character (background removed).
    if (playerSprite.complete && playerSprite.naturalWidth) {
      ctx.save();
      const targetH = player.h * 2.8;
      const targetW = targetH * (playerSprite.naturalWidth / playerSprite.naturalHeight);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(
        playerSprite,
        player.x + player.w / 2 - targetW / 2,
        player.y + player.h - targetH,
        targetW,
        targetH
      );
      ctx.restore();
    }

    if (player.shield) {
      ctx.strokeStyle = '#6de1ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x + player.w/2, player.y + player.h/2, player.w, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  overlayBtn.addEventListener('click', () => {
    initGame();
  });

  initGame();
  loop();
})();
</script>
</body>
</html>
